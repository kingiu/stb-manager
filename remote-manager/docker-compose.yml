version: '3'
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./acl.conf:/mosquitto/config/acl.conf
      - ./passwd:/mosquitto/config/passwd
    restart: unless-stopped
    networks:
      - stb-net

  stb-manager:
    build: ./server
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - MQTT_BROKER=tcp://mosquitto:1883
      - MQTT_USER=admin
      - MQTT_PASS=admin@manager
      - HTTP_PORT=8080
      - OTA_PORT=8081
      - OTA_DIR=/ota
    volumes:
      - ./ota:/ota
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - stb-net

networks:
  stb-net:
    driver: bridge
